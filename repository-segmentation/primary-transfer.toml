schema_version = 1
source = "JoePShoulak/sagan"
destination = "Sagan-Shoulak/sagan"
required_default_branch = "dev"
required_visibility = "public"
split_repository_creation_blocked_until_verified = true

[local_remote]
name = "origin"
before = "https://github.com/JoePShoulak/sagan"
after = "https://github.com/Sagan-Shoulak/sagan.git"

[github]
environments = [
  "documentation",
  "initial-unsigned-release",
  "release-signing",
  "stable-release",
]
secret_names = [
  "SAGAN_RELEASE_TAG_SSH_PRIVATE_KEY",
]
deferred_signing_secret_names = ["SAGAN_SIGNTOOL_COMMAND"]
transfer_policy = "preserve-observed-settings-before-tightening"
release_policy = "paused-until-owner-decides-publication-policy"
self_hosted_runner_labels = ["self-hosted", "sagan-docs-hp1"]
workflows = [
  "coverage.yml",
  "documentation.yml",
  "integration.yml",
  "release-mirror.yml",
  "release-on-main.yml",
  "release.yml",
  "vscode-extension.yml",
  "windows-installer.yml",
]

[[legacy_references]]
path = "README.md"
purpose = "documentation and Codecov badges plus release links"

[[legacy_references]]
path = "MAINTAINERS.md"
purpose = "canonical clone command"

[[legacy_references]]
path = "docs/getting-started/downloads.md"
purpose = "release download link"

[[legacy_references]]
path = "docs/getting-started/editor-support.md"
purpose = "extension release link"

[[legacy_references]]
path = "docs/contributing/hosting.md"
purpose = "self-hosted runner configuration"

[[legacy_references]]
path = "packaging/windows/sagan.iss"
purpose = "publisher, support, and update URLs"

[[legacy_references]]
path = "deploy/releases/github.py"
purpose = "GitHub API repository endpoint"

[[legacy_references]]
path = "deploy/releases/index.py"
purpose = "rendered release navigation"

[[legacy_references]]
path = "scripts/release_metadata.sh"
purpose = "SBOM namespace"

[[legacy_references]]
path = "scripts/primary_release_backup.sh"
purpose = "pre-transfer release source; retire or update after cutover"

[[legacy_references]]
path = "scripts/create_primary_local_backup.sh"
purpose = "pre-transfer mirror source; retire or update after cutover"

[[legacy_references]]
path = "scripts/verify_primary_transfer_parity.sh"
purpose = "source URL in post-transfer redirect and pre-transfer rehearsal checks"

[[legacy_references]]
path = "scripts/primary_release_backup_test.sh"
purpose = "pre-transfer release-backup mock; retire or update after cutover"

[[legacy_references]]
path = "scripts/rehearse_primary_backup.sh"
purpose = "pre-transfer mirror source; retire or update after cutover"

[[external_integrations]]
id = "github-actions"
verification = "Affected dev checks run and observed branch policies match the recorded pre-transfer snapshot; do not add protection during transfer."

[[external_integrations]]
id = "github-releases"
verification = "Existing tags, releases, assets, checksums, and latest-release state are unchanged."

[[external_integrations]]
id = "github-pages-and-docs"
verification = "Existing documentation URLs, deployment configuration, and redirects are intact; deployment remains frozen during transfer."

[[external_integrations]]
id = "hp1-runner"
verification = "The sagan-docs-hp1 runner remains visible to the transferred repository; do not dispatch publication jobs while releases and deployment are paused."

[[external_integrations]]
id = "release-signing"
verification = "The existing environment and reviewer policy are inventoried; signing is deferred, the signing secret is not required for transfer, and all releases remain paused."

[[external_integrations]]
id = "release-mirror"
verification = "Read-only HP1 access to existing releases works through the new canonical path and old-path redirects; synchronization remains frozen during transfer."
